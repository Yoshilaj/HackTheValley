<!doctype html><html><head><title>Book an appointment</title></head>
<body><h1>Request an appointment</h1>
<form action="/mock-clinic/book" method="post">
  <label for="name">Full name *</label><input id="name" name="full_name" required>
  <label for="dob">Date of birth</label><input id="dob" name="dob" type="date">
  <label for="email">E-mail</label><input id="email" name="email" type="email" required>
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="hc">Health card number (optional)</label><input id="hc" name="health_card">
  <label>Preferred time <select name="slot"><option>Morning</option></select></label>
  <label>Reason for visit<textarea name="reason"></textarea></label>
  <input type="hidden" name="csrf" value="x">
  <button type="submit">Send request</button>
</form></body></html>
